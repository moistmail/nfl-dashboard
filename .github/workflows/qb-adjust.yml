name: Update QB adjustments
on:
  schedule:
    - cron: "17 14 * * 2,5"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas pyarrow
      - run: python scripts/build_qb_adjust.py qb_adjust.csv
      - name: Commit if changed
        run: |
          git config user.name "qb-adjust-bot"
          git config user.email "actions@users.noreply.github.com"
          git add qb_adjust.csv
          git diff --cached --quiet || git commit -m "Update QB adjustments"
          git push
